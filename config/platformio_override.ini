; Eigener Build fuer den Shelly Pro 4PM.
; Basis ist tasmota32 (FIRMWARE_TASMOTA32, also MCP23S17 + ADE7953),
; erweitert um die Display-Treiber aus tasmota/user_config_override.h.

[platformio]
default_envs = tasmota32-shellypro4pm

[env:tasmota32-shellypro4pm]
extends                 = env:tasmota32_base
build_flags             = ${env:tasmota32_base.build_flags}
                          -DFIRMWARE_TASMOTA32
                          -DUSE_CONFIG_OVERRIDE
; LVGL wird von diesem Geraet nicht gebraucht. Ohne libesp32_lvgl entfallen
; LVGL, FreeType und die Font-Assets - das verkuerzt den Build deutlich.
; (Der offizielle tasmota32-display-Build macht es aus demselben Grund so.)
lib_extra_dirs          = ${common.lib_extra_dirs}
                          lib/libesp32
lib_ignore              = ${env:tasmota32_base.lib_ignore}
                          Micro-RTSP
